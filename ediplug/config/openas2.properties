# EDIPLUG overrides for config.xml. Baked into the image; secrets are taken from environment variables only.

# ---------------------------------------------------------------------------------------------------------------
# PostgreSQL connection shared by message tracking and the partnership store.
#   AS2_DB_HOST / AS2_DB_PORT / AS2_DB_NAME / AS2_DB_USER / AS2_DB_PASSWORD
#   AS2_DB_SSLMODE      verify-ca for the local container, verify-full for RDS
#   AS2_DB_SSLROOTCERT  /opt/openas2/config/db-ca.pem (local) or /opt/openas2/config/rds-global-bundle.pem (RDS)
# ---------------------------------------------------------------------------------------------------------------
as2_db.url=jdbc:postgresql://$ENV{AS2_DB_HOST}:$ENV{AS2_DB_PORT}/$ENV{AS2_DB_NAME}?sslmode=$ENV{AS2_DB_SSLMODE}&sslrootcert=$ENV{AS2_DB_SSLROOTCERT}&ApplicationName=openas2
as2_db.user=$ENV{AS2_DB_USER}
as2_db.password=$ENV{AS2_DB_PASSWORD}

# External PostgreSQL tracking database
msg_tracking.use_embedded_db=false
msg_tracking.tcp_server_start=false
msg_tracking.db_user=$ENV{AS2_DB_USER}
msg_tracking.db_pwd=$ENV{AS2_DB_PASSWORD}
msg_tracking.db_name=$ENV{AS2_DB_NAME}
msg_tracking.jdbc_connect_string=jdbc:postgresql://$ENV{AS2_DB_HOST}:$ENV{AS2_DB_PORT}/$ENV{AS2_DB_NAME}?sslmode=$ENV{AS2_DB_SSLMODE}&sslrootcert=$ENV{AS2_DB_SSLROOTCERT}&ApplicationName=openas2-tracking
msg_tracking.jdbc_driver=org.postgresql.Driver
msg_tracking.force_load_jdbc_driver=true

# Partnerships: every polling.interval seconds only the version counter (bumped by a DB trigger on any change)
# is read; the partnerships are reloaded when it changes, and fully every full_refresh_interval seconds.
partnerships.polling.interval=10
partnerships.version_query=SELECT version FROM config_version WHERE area = 'partnerships'
partnerships.full_refresh_interval=3600

# AS2 keystore = own key pairs from as2_own_key + partner public certificates from as2_partner_certificate,
# assembled in memory (no keystore file). Private keys in as2_own_key are encrypted PKCS#8 PEMs; their passphrase
# is AS2_KEY_ENCRYPTION_PASSWORD. as2_keystore_password only protects the entries of the in-memory keystore.
# Every polling.interval seconds only the certificate version counter is read; the keystore is rebuilt (and fully
# re-validated) when it changes, and every full_refresh_interval seconds.
as2_keystore_password=$ENV{AS2_KEYSTORE_PASSWORD}
as2_key_encryption_password=$ENV{AS2_KEY_ENCRYPTION_PASSWORD}
as2_certs.fail_on_expired=true
as2_certs.expiry_warning_days=30
as2_certs.polling.interval=10
as2_certs.version_query=SELECT version FROM config_version WHERE area = 'certificates'
as2_certs.full_refresh_interval=3600

# Public async MDN endpoint exposed via reverse proxy (HTTPS at proxy, HTTP to OpenAS2)
as2_async_mdn_url=https://as2.ediplug.com/mdn

# Inbox layout: /inbox/{receiver_as2_id}/{sender_as2_id}/{date}/{message_id}/
module.MessageFileModule.filename=$properties.storageBaseDir$/inbox/$msg.receiver.as2_id$/$msg.sender.as2_id$/$date.yyyy-MM-dd$/$msg.headers.message-id$/$msg.content-disposition.filename$
module.MessageFileModule.header=$properties.storageBaseDir$/inbox/$msg.receiver.as2_id$/$msg.sender.as2_id$/$date.yyyy-MM-dd$/$msg.headers.message-id$/headers.txt

# MDN layout: /mdn/{original_sender_as2_id}/{original_receiver_as2_id}/{date}/{original_message_id}/
module.MDNFileModule.filename=$properties.storageBaseDir$/mdn/$mdn.msg.sender.as2_id$/$mdn.msg.receiver.as2_id$/$date.yyyy-MM-dd$/$mdn.attributes.ORIGINAL_MESSAGE_ID$/$mdn.headers.message-id$.mdn.txt

# Outbox layout: /outbox/{sender_as2_id}/{receiver_as2_id}
pollerConfigBase.outboxdir=$properties.storageBaseDir$/outbox/$partnership.sender.as2_id$/$partnership.receiver.as2_id$
pollerConfigBase.errordir=$properties.storageBaseDir$/outbox/error/$date.yyyy-MM-dd$/$partnership.sender.as2_id$/$partnership.receiver.as2_id$

# Process files in parallel with a thread pool to improve throughput
pollerConfigBase.process_files_in_parallel=true
pollerConfigBase.max_parallel_files=5

# Only process files with .edi extension
pollerConfigBase.fileextensionfilter=edi

# Message-ID values remain RFC-style (<local-part@domain>) while carrying a stable partner-pair correlation key.
as2_message_id_format=msg.$date.yyyy-MM-dd-HHmmss$.$rand.UUID$.$msg.sender.as2_id$.to.$msg.receiver.as2_id$
as2_mdn_message_id_format=mdn.$date.yyyy-MM-dd-HHmmss$.$rand.UUID$.$msg.receiver.as2_id$.to.$msg.sender.as2_id$

# Use a readable fallback payload name when the sender omits a filename.
as2_receive_message_filename_fallback=payload-$date.yyyy-MM-dd-HHmmss$-$rand.shortUUID$.edi

# Container health check (used by the Docker healthcheck)
module.HealthCheckModule.enabled=true
module.HealthCheckModule.protocol=http
module.HealthCheckModule.address=0.0.0.0
module.HealthCheckModule.port=10099
