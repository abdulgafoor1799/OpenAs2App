# EDIPLUG AS2 edge proxy for a VM behind a cloud load balancer.
# TLS is terminated at the load balancer; nginx listens on plain HTTP 8080 (published as host port 80) and is
# reachable only from the load balancer (enforce with the VM's security group / firewall).
#
# Client IPs: the real client address is taken from X-Forwarded-For (ALB) or the PROXY protocol header (NLB with
# proxy protocol v2 enabled on the target group). Set LB_CIDR below to the subnet(s) of your load balancer.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # ---- Real client IP from the load balancer ----
  # ALB: X-Forwarded-For. For an NLB with proxy protocol, change the listen line to "listen 8080 proxy_protocol;"
  # and real_ip_header to "proxy_protocol".
  set_real_ip_from  10.0.0.0/8;      # LB_CIDR: replace with your VPC / load balancer subnets
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  # ---- Rate limiting / abuse protection (per real client IP) ----
  limit_req_zone  $binary_remote_addr zone=req_per_ip:20m  rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req         zone=req_per_ip burst=40 nodelay;
  limit_req_status  429;
  limit_req_log_level warn;
  limit_conn        conn_per_ip 30;
  limit_conn_status 429;
  limit_conn_log_level warn;

  client_header_timeout 15s;
  client_body_timeout   60s;
  send_timeout          60s;
  keepalive_timeout     65s;   # longer than the ALB idle timeout (60s) to avoid 502s on reused connections
  client_max_body_size  100m;  # largest AS2 message accepted

  upstream as2_receive_upstream { server openas2:10080; }
  upstream as2_mdn_upstream     { server openas2:10081; }
  upstream as2_health_upstream  { server openas2:10099; }

  server {
    listen 8080 default_server;
    server_name _;

    # Load balancer health check: healthy only when OpenAS2 is (Host header is the target IP, so no host match)
    location = /health {
      proxy_pass http://as2_health_upstream;
    }

    # nginx-only liveness (container healthcheck)
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    location = /receive {
      # Optionally restrict to trading partner IPs:
      # allow 203.0.113.0/24;
      # deny all;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      proxy_pass http://as2_receive_upstream;
    }

    location = /mdn {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      proxy_pass http://as2_mdn_upstream;
    }

    location / {
      return 403;
    }
  }
}
